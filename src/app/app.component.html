<h1>Todo App</h1>

<div>
  <div>
    <form [formGroup]="todoForm" (ngSubmit)="onSubmit()">
      <input type="text" formControlName="title" placeholder="Enter task">
      <div>
        <button type="submit" [disabled]="todoForm.invalid">Add Task</button>
      </div>
    </form>
  </div>
</div>


<div class="tasks">
  <ul>
    <li *ngFor="let task of tasks; let i = index">{{task}} <span><button (click)="editTask(i)">Edit</button></span><span><button class="delete-btn" (click)="deleteTask(i)">Delete</button></span></li>
  </ul>
</div>
<router-outlet></router-outlet>
